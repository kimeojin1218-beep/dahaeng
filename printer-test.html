<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다행 프린터 테스트</title>
<style>
  body{font-family:-apple-system,'Pretendard','Noto Sans KR',sans-serif;max-width:520px;margin:24px auto;padding:0 16px;color:#1a2e24;}
  h2{margin-bottom:4px;}
  p.sub{margin-top:0;color:#4a6b5a;font-size:14px;}
  label{display:block;font-size:13px;margin:16px 0 6px;color:#4a6b5a;}
  input{font-size:16px;padding:10px;width:100%;box-sizing:border-box;border:1px solid #c5e2d5;border-radius:10px;}
  .row{margin-top:8px;}
  .row b{display:block;font-size:13px;margin:14px 0 4px;color:#4a6b5a;font-weight:500;}
  button{font-size:15px;padding:12px 14px;margin:4px 6px 4px 0;border-radius:10px;border:1px solid #3aaa7a;background:#fff;color:#1a2e24;cursor:pointer;}
  button:active{background:#e6f4ed;}
  #log{white-space:pre-wrap;background:#f4f8f6;padding:12px;border-radius:10px;font-size:13px;min-height:140px;margin-top:16px;line-height:1.6;}
</style>
</head>
<body>
<h2>다행 프린터 테스트</h2>
<p class="sub">프린터가 웹페이지 명령으로 출력되는지 확인하는 페이지예요.</p>

<label>프린터 IP 주소</label>
<input id="ip" value="192.168.1.100">

<div class="row">
  <b>① 먼저 이것부터 (http, 포트 8008)</b>
  <button onclick="run('8008','text')">글자 출력</button>
  <button onclick="run('8008','image')">이미지 출력 (한글·한자)</button>
</div>

<div class="row">
  <b>② 나중에 쓸 방식 (https, 포트 8043)</b>
  <button onclick="run('8043','text')">글자 출력</button>
  <button onclick="run('8043','image')">이미지 출력</button>
</div>

<div id="log">여기에 결과가 나와요.</div>

<script src="epos-2.27.0.js"></script>
<script>
var logEl = document.getElementById('log');
function log(m){ logEl.textContent += m + '\n'; }

function run(port, mode){
  logEl.textContent = '';
  var ip = document.getElementById('ip').value.trim();

  if (typeof epson === 'undefined' || !epson.ePOSDevice) {
    log('epos-2.27.0.js 파일을 찾지 못했어요.');
    log('이 파일(printer-test.html)과 같은 폴더에 epos-2.27.0.js가 있는지 확인해요.');
    return;
  }

  var dev = new epson.ePOSDevice();
  log('연결 시도: ' + ip + ':' + port);

  dev.connect(ip, port, function(res){
    log('연결 결과: ' + res);
    if (res !== 'OK' && res !== 'SSL_CONNECT_OK') {
      log('연결에 실패했어요. 위 "연결 결과" 문구를 그대로 알려줘요.');
      return;
    }

    dev.createDevice('local_printer', dev.DEVICE_TYPE_PRINTER, {crypto:false, buffer:false}, function(printer, code){
      log('프린터 열기 결과: ' + code);
      if (code !== 'OK') {
        log('프린터를 열지 못했어요. 위 문구를 그대로 알려줘요.');
        return;
      }

      printer.onreceive = function(r){
        log('출력 결과: ' + (r.success ? '성공' : '실패 (' + r.code + ')'));
      };
      printer.onerror = function(e){
        log('프린터 오류: ' + JSON.stringify(e));
      };

      if (mode === 'text') {
        printer.addText('DAHAENG TEST\n');
        printer.addText('printer connection OK\n');
        printer.addFeedLine(2);
        printer.addCut(printer.CUT_FEED);
      } else {
        var c = document.createElement('canvas');
        c.width = 512;
        c.height = 170;
        var x = c.getContext('2d');
        x.fillStyle = '#fff';
        x.fillRect(0, 0, c.width, c.height);
        x.fillStyle = '#000';
        x.textAlign = 'center';
        x.font = 'bold 44px sans-serif';
        x.fillText('다행 茶幸', 256, 75);
        x.font = '26px sans-serif';
        x.fillText('이미지 출력 테스트', 256, 125);
        printer.addImage(x, 0, 0, c.width, c.height, printer.COLOR_1, printer.MODE_GRAY16);
        printer.addFeedLine(2);
        printer.addCut(printer.CUT_FEED);
      }

      printer.send();
      log('프린터로 전송했어요.');
    });
  }, {eposprint: true});
}
</script>
</body>
</html>
