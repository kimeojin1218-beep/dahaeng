<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다행 茶幸</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500&display=swap');
  :root{--bg:#EFF7F3;--paper:#F8FDFB;--ink:#1a2e24;--ink-light:#4a6b5a;--ink-faint:#93b5a4;--accent:#3aaa7a;--border:#c5e2d5;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);font-family:'Pretendard','Noto Sans KR',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem;}
  .kiosk{width:100%;max-width:420px;background:var(--paper);border:1px solid var(--border);border-radius:24px;padding:2.5rem 2rem;position:relative;}
  .kiosk::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent);}
  .brand{text-align:center;margin-bottom:2.5rem;padding-bottom:2rem;border-bottom:1px solid var(--border);}
  .brand-ko{font-family:'Noto Serif KR',serif;font-size:32px;font-weight:300;color:var(--ink);letter-spacing:0.3em;}
  .brand-hanja{font-size:22px;color:var(--ink-light);letter-spacing:0.2em;margin-top:8px;}
  .brand-desc{font-size:14px;color:var(--ink-faint);letter-spacing:0.1em;margin-top:12px;}
  .screen{display:none;}.screen.active{display:block;}
  .field-group{margin-bottom:1.5rem;}
  .field-label{font-size:11px;letter-spacing:0.08em;color:var(--ink-light);margin-bottom:8px;display:block;font-family:'Pretendard','Noto Sans KR',sans-serif;}
  .field-row{display:flex;gap:6px;}
  .field-row input,.field-row select{flex:1;height:44px;padding:0 12px;border:1px solid var(--border);border-radius:12px;background:var(--paper);font-family:'Pretendard','Noto Sans KR',sans-serif;font-size:14px;color:var(--ink);outline:none;appearance:none;-webkit-appearance:none;}
  .field-row input:focus,.field-row select:focus{border-color:var(--accent);}
  .toggle-group{display:flex;margin-bottom:1.25rem;border-radius:12px;overflow:hidden;}
  .toggle-btn{flex:1;height:40px;border:1px solid var(--border);background:var(--paper);font-family:'Pretendard','Noto Sans KR',sans-serif;font-size:12px;letter-spacing:0.04em;color:var(--ink-light);cursor:pointer;transition:all 0.2s;}
  .toggle-btn:not(:last-child){border-right:none;}
  .toggle-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .fortune-btns{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:1.25rem;border-radius:12px;overflow:hidden;}
  .fortune-btn{height:44px;border:1px solid var(--border);background:var(--paper);font-family:'Pretendard','Noto Sans KR',sans-serif;font-size:12px;letter-spacing:0.02em;color:var(--ink-light);cursor:pointer;transition:all 0.2s;}
  .fortune-btn:not(:last-child){border-right:none;}
  .fortune-btn.active{background:var(--accent);color:var(--paper);border-color:var(--accent);}
  .btn-primary{width:100%;height:52px;background:var(--accent);color:var(--paper);border:none;border-radius:14px;font-family:'Pretendard','Noto Sans KR',sans-serif;font-size:15px;font-weight:500;letter-spacing:0.08em;cursor:pointer;margin-top:2rem;transition:opacity 0.2s;}
  .btn-primary:hover{opacity:0.85;}
  .btn-secondary{width:100%;height:44px;background:transparent;color:var(--ink-light);border:1px solid var(--border);border-radius:12px;font-family:'Pretendard','Noto Sans KR',sans-serif;font-size:12px;letter-spacing:0.04em;cursor:pointer;margin-top:8px;}
  .loading-screen{text-align:center;padding:4rem 0;}
  .loading-dots{display:flex;justify-content:center;gap:8px;margin-bottom:1.5rem;}
  .dot{width:6px;height:6px;background:var(--accent);border-radius:50%;animation:dotPulse 1.4s ease-in-out infinite;}
  .dot:nth-child(2){animation-delay:0.2s;}.dot:nth-child(3){animation-delay:0.4s;}
  @keyframes dotPulse{0%,80%,100%{opacity:0.2;transform:scale(0.8);}40%{opacity:1;transform:scale(1);}}
  .loading-text{font-size:12px;letter-spacing:0.15em;color:var(--ink-light);}
  .fortune-badge{text-align:center;font-size:14px;letter-spacing:0.15em;color:var(--accent);margin-bottom:1rem;padding:10px;border:1px solid var(--accent);border-radius:12px;}
  .result-illu{width:320px;height:320px;margin:0 auto;display:flex;align-items:center;justify-content:center;}
  .result-ilju{text-align:center;font-family:'Pretendard','Noto Sans KR',sans-serif;font-size:24px;font-weight:700;letter-spacing:0.2em;color:var(--ink);margin-bottom:6px;}
  .result-ilju-label{font-size:13px;font-weight:300;color:var(--ink-light);letter-spacing:0.1em;margin-left:10px;vertical-align:middle;}
  .result-desc{text-align:center;font-size:12px;color:var(--ink-light);letter-spacing:0.06em;margin-bottom:2rem;line-height:1.8;}
  .divider{border:none;border-top:1px solid var(--border);margin:1.5rem 0;}
  .section-title{font-size:10px;letter-spacing:0.2em;color:var(--ink-faint);margin-bottom:12px;}
  .pillar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:1.5rem;}
  .pillar-cell{text-align:center;padding:10px 4px;border:1px solid var(--border);background:var(--bg);}
  .pillar-head{font-size:9px;color:var(--ink-faint);letter-spacing:0.1em;margin-bottom:6px;}
  .pillar-stem{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:300;color:var(--ink);}
  .pillar-branch{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:300;color:var(--ink-light);}
  .ohaeng-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .ohaeng-name{font-family:'Noto Serif KR',serif;font-size:13px;color:var(--ink-light);width:20px;}
  .ohaeng-track{flex:1;height:8px;border-radius:4px;background:var(--border);}
  .ohaeng-fill{height:100%;border-radius:4px;transition:width 0.8s ease;}
  .ohaeng-pct{font-size:11px;color:var(--ink-faint);width:32px;text-align:right;}
  .rx-box{border:1px solid var(--border);padding:1.25rem;margin-bottom:1.5rem;background:var(--bg);}
  .rx-header{font-size:10px;letter-spacing:0.2em;color:var(--ink-faint);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
  .rx-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .rx-key{font-size:11px;color:var(--ink-light);letter-spacing:0.05em;}
  .rx-val{font-family:'Noto Serif KR',serif;font-size:13px;color:var(--ink);letter-spacing:0.06em;}
  .fortune-text{font-size:13px;color:var(--ink-light);line-height:2;letter-spacing:0.04em;font-family:'Noto Serif KR',serif;font-weight:300;}
</style>
</head>
<body>
<div class="kiosk">
  <div class="brand">
    <div class="brand-ko">다행</div>
    <div class="brand-hanja">茶幸</div>
    <div class="brand-desc">당신에게 꼭 맞는 차 한 잔을 처방해드려요</div>
  </div>

  <div class="screen active" id="screen-input">
    <div class="field-group">
      <span class="field-label">성별</span>
      <div class="toggle-group">
        <button class="toggle-btn active" id="btn-male" onclick="setGender('남')">남성</button>
        <button class="toggle-btn" id="btn-female" onclick="setGender('여')">여성</button>
      </div>
    </div>
    <div class="field-group">
      <span class="field-label">원하는 처방</span>
      <div class="fortune-btns">
        <button class="fortune-btn active" id="btn-life" onclick="setFortune('인생총운')">인생총운</button>
        <button class="fortune-btn" id="btn-love" onclick="setFortune('연애운')">연애운</button>
        <button class="fortune-btn" id="btn-pass" onclick="setFortune('합격운')">합격운</button>
      </div>
    </div>
    <div class="field-group">
      <span class="field-label">양력 / 음력</span>
      <div class="toggle-group">
        <button class="toggle-btn active" id="btn-solar" onclick="setCalendar('solar')">양력</button>
        <button class="toggle-btn" id="btn-lunar" onclick="setCalendar('lunar')">음력</button>
      </div>
    </div>
    <div class="field-group">
      <span class="field-label">생년월일</span>
      <div class="field-row">
        <input type="number" id="year" placeholder="1999" min="1930" max="2010" style="flex:2">
        <input type="number" id="month" placeholder="월" min="1" max="12">
        <input type="number" id="day" placeholder="일" min="1" max="31">
      </div>
      <div id="leap-wrap" style="display:none;margin-top:10px;">
        <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-light);cursor:pointer;">
          <input type="checkbox" id="is-leap"> 윤달
        </label>
      </div>
    </div>
    <div class="field-group">
      <span class="field-label">태어난 시간</span>
      <div style="display:flex;gap:6px;align-items:stretch;">
        <select id="hour" style="flex:1;height:44px;padding:0 10px;border:1px solid var(--border);background:var(--paper);font-family:'Noto Sans KR',sans-serif;font-size:14px;color:var(--ink);outline:none;appearance:none;-webkit-appearance:none;">
          <option value="23">자시 (23~01시)</option>
          <option value="1">축시 (01~03시)</option>
          <option value="3">인시 (03~05시)</option>
          <option value="5">묘시 (05~07시)</option>
          <option value="7">진시 (07~09시)</option>
          <option value="9">사시 (09~11시)</option>
          <option value="11">오시 (11~13시)</option>
          <option value="13">미시 (13~15시)</option>
          <option value="15">신시 (15~17시)</option>
          <option value="17">유시 (17~19시)</option>
          <option value="19">술시 (19~21시)</option>
          <option value="21">해시 (21~23시)</option>
        </select>
        <button id="btn-no-hour" onclick="setTimeKnown(!timeKnown)" style="height:44px;padding:0 12px;border:1px solid var(--border);border-radius:12px;background:var(--paper);font-family:'Pretendard','Noto Sans KR',sans-serif;font-size:11px;letter-spacing:0.04em;color:var(--ink-light);cursor:pointer;white-space:nowrap;transition:all 0.2s;">생시 모름</button>
      </div>
    </div>
    <button class="btn-primary" onclick="doSubmit()">처방받기</button>
  </div>

  <div class="screen" id="screen-loading">
    <div class="loading-screen">
      <div class="loading-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <div class="loading-text">기운을 분석하는 중입니다</div>
    </div>
  </div>

  <div class="screen" id="screen-result">
    <div class="fortune-badge" id="result-fortune-type">인생총운</div>
    <div class="result-illu" id="result-illu" style="background:transparent;border:none;"><img src="" id="result-illu-img" style="width:100%;height:100%;object-fit:contain;"></div>
    <div class="result-ilju" id="result-ilju">—<span class="result-ilju-label">일주</span></div>
    <div class="result-desc" id="result-desc"></div>
    <hr class="divider">
    <div class="section-title">사주팔자</div>
    <div class="pillar-grid" id="pillar-grid"></div>
    <hr class="divider">
    <div class="section-title">오행 비율</div>
    <div id="ohaeng-bars"></div>
    <hr class="divider">
    <div class="rx-box">
      <div class="rx-header">처방전 Rx.</div>
      <div class="rx-row"><span class="rx-key">처방 목적</span><span class="rx-val" id="rx-fortune">—</span></div>
      <div class="rx-row"><span class="rx-key">처방 기운</span><span class="rx-val" id="rx-lack">—</span></div>
      <div class="rx-row" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
        <span class="rx-key" style="font-size:13px;font-weight:500;color:var(--ink);">오늘의 차</span>
        <span class="rx-val" id="rx-tea" style="font-size:20px;font-weight:600;color:var(--accent);letter-spacing:0.1em;">—</span>
      </div>
    </div>
    <div class="section-title">오늘의 메시지</div>
    <div class="fortune-text" id="fortune-text"></div>
    <button class="btn-primary" onclick="printReceipt()" style="margin-top:2rem">처방전 출력하기</button>
    <button class="btn-secondary" onclick="doReset()">다시 하기</button>
  </div>
</div>
<!-- Epson ePOS SDK for JavaScript v2.27.0 -->

function lydays(y){let s=348;for(let i=0x8000;i>0x8;i>>=1)s+=LD[y-1900]&i?1:0;return s+lmd2(y);}
function lm(y){return LD[y-1900]&0xf;}
function lmd2(y){const m=lm(y);return m?(LD[y-1900]&0x10000?30:29):0;}
function lmd(y,m){return LD[y-1900]&(0x10000>>m)?30:29;}
function lunar2solar(y,m,d,isLeap){
  const base=new Date(1900,0,31);let off=0;
  for(let i=1900;i<y;i++)off+=lydays(i);
  const lmv=lm(y);let leap=false;
  for(let i=1;i<m;i++){if(lmv>0&&i===lmv&&!leap){off+=lmd2(y);leap=true;i--;}else off+=lmd(y,i);}
  if(isLeap&&lmv===m)off+=lmd(y,m);
  off+=d-1;
  const r=new Date(base.getTime()+off*86400000);
  return{year:r.getFullYear(),month:r.getMonth()+1,day:r.getDate()};
}

function jdnCalc(y,m,d){const a=Math.floor((14-m)/12),y2=y+4800-a,m2=m+12*a-3;return d+Math.floor((153*m2+2)/5)+365*y2+Math.floor(y2/4)-Math.floor(y2/100)+Math.floor(y2/400)-32045;}
function mkP(si,bi){return{stem:SKR[si],branch:BKR[bi],stemHj:SHJ[si],branchHj:BHJ[bi]};}

function getDayPillar(y,m,d){const idx=(jdnCalc(y,m,d)+49)%60;return mkP(idx%10,idx%12);}
function getYearPillar(y,m,d){
  const ip=(JIEQI[String(y)]||{})['입춘'];
  const t=new Date(y,m-1,d);
  const sy=ip&&t<new Date(ip)?y-1:y;
  const idx=((sy-1984)%60+60)%60;
  return mkP(idx%10,idx%12);
}
function getMonthPillar(y,m,d){
  const t=new Date(y,m-1,d);
  const jThis=JIEQI[String(y)]||{};
  const jPrev=JIEQI[String(y-1)]||{};
  let bestDt=null,bestBranch='丑';
  for(const[term,branch] of Object.entries(TERM_BRANCH)){
    const s=jThis[term];if(!s)continue;
    const dt=new Date(s);
    if(dt<=t&&(!bestDt||dt>bestDt)){bestDt=dt;bestBranch=branch;}
  }
  const prevDs=jPrev['대설'];
  if(prevDs){const dt=new Date(prevDs);if(dt<=t&&(!bestDt||dt>bestDt)){bestDt=dt;bestBranch='子';}}
  const yp=getYearPillar(y,m,d);
  const yinStem=YS_TO_YIN[yp.stemHj];
  const mbIdx=MB_SEQ.indexOf(bestBranch);
  const msi=(SHJ.indexOf(yinStem)+mbIdx)%10;
  return mkP(msi,BHJ.indexOf(bestBranch));
}
function getHourPillar(dayStemKr,hh){
  const adj=hh===23?0:hh;
  const shifted=(adj*60+60)%(24*60);
  const hi=Math.floor(shifted/120)%12;
  const DS_TO_ZI={갑:'甲',기:'甲',을:'丙',경:'丙',병:'戊',신:'戊',정:'庚',임:'庚',무:'壬',계:'壬'};
  const zi=DS_TO_ZI[dayStemKr];
  const hsi=(SHJ.indexOf(zi)+hi)%10;
  return mkP(hsi,hi);
}

// 오행 상생상극
const ELEM_ORDER=['목','화','토','금','수'];
// 일간 기준 타 천간의 십성 계산
function getTenGod(dayHj, targetHj){
  const dayElem=SE[SKR[SHJ.indexOf(dayHj)]];
  const targetElem=SE[SKR[SHJ.indexOf(targetHj)]];
  const dayYang=SHJ.indexOf(dayHj)%2===0;
  const targetYang=SHJ.indexOf(targetHj)%2===0;
  const samePolarity=dayYang===targetYang;
  const di=ELEM_ORDER.indexOf(dayElem);
  const ti=ELEM_ORDER.indexOf(targetElem);
  const diff=(ti-di+5)%5;
  // diff 0=비겁, 1=식상(내가생함), 2=재성(내가극함), 3=관성(나를극함), 4=인성(나를생함)
  if(diff===0) return samePolarity?'비견':'겁재';
  if(diff===1) return samePolarity?'식신':'상관';
  if(diff===2) return samePolarity?'편재':'정재';
  if(diff===3) return samePolarity?'편관':'정관';
  if(diff===4) return samePolarity?'편인':'정인';
}

// 십성 → 오행 역매핑
function tenGodElem(dayHj, tenGodName){
  if(!dayHj||!tenGodName)return '목';
  var idx=SHJ.indexOf(dayHj);
  if(idx<0)return '목';
  var dayElem=SE[SKR[idx]];
  if(!dayElem)return '목';
  var di=ELEM_ORDER.indexOf(dayElem);
  var godMap={비견:0,겁재:0,식신:1,상관:1,편재:2,정재:2,편관:3,정관:3,편인:4,정인:4};
  var diff=godMap[tenGodName];
  if(diff===undefined)return '목';
  return ELEM_ORDER[(di+diff)%5];
}

// 사주 8자에서 각 십성 오행 강도 집계
function calcTenGodStrength(pillars, dayHj){
  const strength={비견:0,겁재:0,식신:0,상관:0,편재:0,정재:0,편관:0,정관:0,편인:0,정인:0};
  pillars.forEach(function(p){
    if(!p)return;
    // 천간
    const sg=getTenGod(dayHj,p.stemHj);
    if(sg)strength[sg]++;
    // 지지 (지지 대표 오행으로 천간 변환해서 십성 계산)
    const bElem=BE[p.branch];
    // 지지 오행에 해당하는 양간으로 십성 계산
    const bHjMap={목:'甲',화:'丙',토:'戊',금:'庚',수:'壬'};
    const bg=getTenGod(dayHj,bHjMap[bElem]);
    if(bg)strength[bg]++;
  });
  return strength;
}

// 운세별 처방 오행 결정
function getPrescriptionOhaeng(oh, tgStrength, dayHj, fortune, gender){
  if(fortune==='인생총운'){
    return oh.lacking;
  }
  if(fortune==='연애운'){
    // 남성: 재성(편재+정재) 오행, 여성: 관성(편관+정관) 오행
    const targetGods=gender==='남'?['편재','정재']:['편관','정관'];
    const targetElem=tenGodElem(dayHj, targetGods[0]);
    // 재성/관성 오행이 사주에서 약하면 그걸 강화, 아니면 그 오행 처방
    return targetElem;
  }
  if(fortune==='합격운'){
    // 관성(편관+정관) + 인성(편인+정인) 중 더 약한 쪽
    const guanElem=tenGodElem(dayHj,'편관');
    const inElem=tenGodElem(dayHj,'편인');
    const guanStr=(tgStrength['편관']||0)+(tgStrength['정관']||0);
    const inStr=(tgStrength['편인']||0)+(tgStrength['정인']||0);
    return guanStr<=inStr?guanElem:inElem;
  }
  return oh.lacking;
}

function calcOhaeng(ps){
  const c={목:0,화:0,토:0,금:0,수:0};
  ps.forEach(function(p){if(!p)return;if(SE[p.stem])c[SE[p.stem]]++;if(BE[p.branch])c[BE[p.branch]]++;});
  const tot=Object.values(c).reduce(function(a,b){return a+b;},0);
  const r={};Object.keys(c).forEach(function(k){r[k]=tot?Math.round(c[k]/tot*100):0;});
  return{count:c,ratio:r,lacking:Object.entries(c).sort(function(a,b){return a[1]-b[1];})[0][0]};
}

async function doSubmit(){
  let y=parseInt(document.getElementById('year').value);
  let m=parseInt(document.getElementById('month').value);
  let d=parseInt(document.getElementById('day').value);
  if(!y||!m||!d){alert('생년월일을 입력해주세요');return;}
  if(y<1930||y>2010){alert('1930~2010년 사이로 입력해주세요');return;}
  if(calType==='lunar'){
    try{const s=lunar2solar(y,m,d,document.getElementById('is-leap').checked);y=s.year;m=s.month;d=s.day;}
    catch(e){alert('음력 변환 실패');return;}
  }
  const hh=timeKnown?parseInt(document.getElementById('hour').value):null;
  showScreen('screen-loading');

  const yp=getYearPillar(y,m,d),mp=getMonthPillar(y,m,d),dp=getDayPillar(y,m,d);
  const hp=hh!==null?getHourPillar(dp.stem,hh):null;
  const ps=[yp,mp,dp,hp];
  const oh=calcOhaeng(ps);
  const tgStrength=calcTenGodStrength(ps,dp.stemHj);
  const prescribeOhaeng=getPrescriptionOhaeng(oh,tgStrength,dp.stemHj,fortuneType,gender);
  const tea=TEA[prescribeOhaeng];
  const ilju=dp.stem+dp.branch,iljuHj=dp.stemHj+dp.branchHj;

  let fortune='';
  try{fortune=await callClaude(ilju,iljuHj,oh,prescribeOhaeng,tea,fortuneType,gender);}
  catch(e){fortune='차 한 잔의 여유가 오늘 하루를 다르게 만들어줄 것입니다.';}
  curResult={yp,mp,dp,hp,oh,tgStrength,ilju,iljuHj,prescribeOhaeng,tea,fortune,fortuneType,gender};
  showResult(curResult);
}

async function callClaude(ilju,iljuHj,oh,prescribeOhaeng,tea,fortuneType,gender){
  const fortuneDesc={
    '인생총운':'전반적인 삶의 기운과 균형',
    '연애운':gender==='남'?'인연과 재성의 기운':'인연과 관성의 기운',
    '합격운':'성취와 학업의 기운'
  };
  const prompt='당신은 다행(茶幸) 브랜드의 사주 처방 전문가입니다. 다음 정보를 바탕으로 따뜻하고 시적인 처방 메시지를 3문장으로 작성해주세요.\n'
    +'- 일주: '+ilju+' ('+iljuHj+')\n'
    +'- 오행 비율: 목'+oh.ratio['목']+'% 화'+oh.ratio['화']+'% 토'+oh.ratio['토']+'% 금'+oh.ratio['금']+'% 수'+oh.ratio['수']+'%\n'
    +'- 처방 목적: '+fortuneType+' ('+fortuneDesc[fortuneType]+')\n'
    +'- 처방 오행: '+prescribeOhaeng+'('+HJ[prescribeOhaeng]+')\n'
    +'- 처방된 차: '+tea+'\n'
    +'조건: 사주를 믿지 않는 사람도 공감할 수 있는 따뜻한 톤, '+fortuneType+'을 위한 구체적인 격려, '+tea+' 한 잔과 자연스럽게 연결, 정확히 3문장, 한국어로만';
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})});
  const data=await res.json();
  return data.content[0].text;
}

/* ---------- 출력 상태 오버레이 ---------- */
function printOverlay(state, msg){
  var ov = document.getElementById('print-ov');
  if (!ov) {
    ov = document.createElement('div');
    ov.id = 'print-ov';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(26,46,36,.45);display:flex;align-items:center;justify-content:center;z-index:9000;padding:24px;';
    ov.innerHTML = '<div style="background:var(--paper);border-radius:20px;padding:28px 24px;max-width:340px;width:100%;text-align:center;font-family:Pretendard,\'Noto Sans KR\',sans-serif;color:var(--ink)">'
      + '<div id="print-ov-title" style="font-family:\'Noto Serif KR\',serif;font-size:20px;letter-spacing:.1em;margin-bottom:10px"></div>'
      + '<div id="print-ov-msg" style="font-size:13px;line-height:1.7;color:var(--ink-light)"></div>'
      + '<div id="print-ov-btns" style="margin-top:18px"></div></div>';
    document.body.appendChild(ov);
  }
  var t = document.getElementById('print-ov-title'), m = document.getElementById('print-ov-msg'), b = document.getElementById('print-ov-btns');
  b.innerHTML = '';
  if (state === 'hide') { ov.remove(); return; }
  if (state === 'busy') { t.textContent = '처방전을 출력하는 중'; m.textContent = msg || '잠시만 기다려 주세요'; }
  if (state === 'done') { t.textContent = '처방전이 나왔어요'; m.textContent = '아래 출력구에서 처방전을 가져가 주세요'; setTimeout(function(){ printOverlay('hide'); }, 2500); }
  if (state === 'error') {
    t.textContent = '출력하지 못했어요'; m.textContent = msg;
    b.innerHTML = '<button class="btn-primary" style="margin-top:0" onclick="printReceipt()">다시 시도</button>'
      + '<button class="btn-secondary" onclick="printOverlay(\'hide\');openPrintPreview()">화면으로 보기</button>'
      + '<button class="btn-secondary" onclick="printOverlay(\'hide\')">닫기</button>';
  }
}

/* ---------- 영수증 이미지 그리기 (한글·한자는 이미지로 출력) ---------- */
function loadImg(src){ return new Promise(function(res){ var i = new Image(); i.onload = function(){ res(i); }; i.onerror = function(){ res(null); }; i.src = src; }); }
async function ensureFonts(){
  if (!document.fonts || !document.fonts.load) return;
  try {
    await Promise.race([
      Promise.all(['400 20px "Noto Serif KR"','500 20px "Noto Serif KR"','400 20px Pretendard','600 20px Pretendard'].map(function(f){ return document.fonts.load(f, '다행茶幸'); })),
      new Promise(function(r){ setTimeout(r, 2500); })
    ]);
  } catch(e){}
}
var SERIF = '"Noto Serif KR", "Apple SD Gothic Neo", serif';
var SANS = 'Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif';

function spacedText(ctx, text, cx, y, spacing){
  var chars = Array.from(text), widths = chars.map(function(c){ return ctx.measureText(c).width; });
  var total = widths.reduce(function(a,b){ return a+b; }, 0) + spacing * (chars.length - 1);
  var x = cx - total / 2, align = ctx.textAlign; ctx.textAlign = 'left';
  chars.forEach(function(c, i){ ctx.fillText(c, x, y); x += widths[i] + spacing; });
  ctx.textAlign = align;
}
function wrapLines(ctx, text, maxW){
  var lines = [];
  String(text).split('\n').forEach(function(para){
    var words = para.split(' '), line = '';
    words.forEach(function(w){
      var test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width <= maxW) { line = test; return; }
      if (line) lines.push(line);
      // 한 단어가 너무 길면 글자 단위로 자르기
      line = '';
      Array.from(w).forEach(function(ch){
        if (ctx.measureText(line + ch).width > maxW) { lines.push(line); line = ch; } else line += ch;
      });
    });
    lines.push(line);
  });
  return lines;
}
function dashed(ctx, y){ ctx.save(); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.moveTo(24, y); ctx.lineTo(PRINT_W - 24, y); ctx.stroke(); ctx.restore(); }

function ditherRegion(ctx, x0, y0, w, h){
  // Floyd–Steinberg: 그림은 회색톤이 살아나도록 점묘 처리
  var img = ctx.getImageData(x0, y0, w, h), d = img.data, g = new Float32Array(w * h);
  for (var i = 0; i < w * h; i++) g[i] = 0.299 * d[i*4] + 0.587 * d[i*4+1] + 0.114 * d[i*4+2];
  for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
    var k = y * w + x, o = g[k], n = o < 128 ? 0 : 255, e = o - n; g[k] = n;
    if (x + 1 < w) g[k+1] += e * 7/16;
    if (y + 1 < h) { if (x > 0) g[k+w-1] += e * 3/16; g[k+w] += e * 5/16; if (x + 1 < w) g[k+w+1] += e * 1/16; }
  }
  for (var j = 0; j < w * h; j++) { d[j*4] = d[j*4+1] = d[j*4+2] = g[j]; d[j*4+3] = 255; }
  ctx.putImageData(img, x0, y0);
}
function thresholdAll(ctx, w, h, skip){
  var img = ctx.getImageData(0, 0, w, h), d = img.data;
  for (var y = 0; y < h; y++) {
    if (skip && y >= skip.y && y < skip.y + skip.h) continue;
    for (var x = 0; x < w; x++) { var i = (y * w + x) * 4, v = (d[i] + d[i+1] + d[i+2]) / 3 < 160 ? 0 : 255; d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255; }
  }
  ctx.putImageData(img, 0, 0);
}

async function buildReceiptCanvas(r){
  await ensureFonts();
  var illu = await loadImg(ILLU_GRAY);
  var W = PRINT_W, c = document.createElement('canvas'); c.width = W; c.height = 2400;
  var x = c.getContext('2d'), y = 28, CX = W / 2, PAD = 32, illuBox = null;
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, c.height); x.fillStyle = '#000'; x.textBaseline = 'alphabetic'; x.textAlign = 'center';

  x.font = '500 46px ' + SERIF; y += 46; spacedText(x, '다행 茶幸', CX, y, 14);
  x.font = '400 19px ' + SANS; y += 36; spacedText(x, '당신에게 꼭 맞는 차 한 잔을 처방해드려요', CX, y, 1);
  y += 24; dashed(x, y); y += 22;

  x.font = '600 22px ' + SANS; y += 22; spacedText(x, '[ ' + r.fortuneType + ' ]', CX, y, 3);
  y += 18;
  if (illu) {
    var ih = 340, iw = Math.round(illu.width * ih / illu.height);
    if (iw > W - 2 * PAD) { iw = W - 2 * PAD; ih = Math.round(illu.height * iw / illu.width); }
    x.drawImage(illu, Math.round(CX - iw / 2), y, iw, ih);
    illuBox = {x: 0, y: y, w: W, h: ih}; y += ih + 8;
  }
  x.font = '500 58px ' + SERIF; y += 58; spacedText(x, r.ilju + ' 일주', CX, y, 10);
  x.font = '400 20px ' + SANS; y += 14;
  wrapLines(x, getIljuDesc(r.dp.stem, r.dp.branch), W - 2 * PAD).forEach(function(l){ y += 30; x.fillText(l, CX, y); });
  y += 22; dashed(x, y); y += 20;

  // 사주팔자
  x.textAlign = 'left'; x.font = '600 18px ' + SANS; y += 18; x.fillText('사주팔자', PAD, y);
  var labels = ['연주','월주','일주','시주'], ps = [r.yp, r.mp, r.dp, r.hp], cw = (W - 2 * PAD) / 4;
  x.textAlign = 'center'; y += 10;
  ps.forEach(function(p, i){
    var cx = PAD + cw * i + cw / 2;
    x.font = '400 16px ' + SANS; x.fillText(labels[i], cx, y + 22);
    x.font = '500 38px ' + SERIF; x.fillText(p ? p.stemHj : '—', cx, y + 70); x.fillText(p ? p.branchHj : '—', cx, y + 114);
  });
  y += 126; dashed(x, y); y += 20;

  // 오행 비율
  x.textAlign = 'left'; x.font = '600 18px ' + SANS; y += 18; x.fillText('오행 비율', PAD, y); y += 8;
  ['목','화','토','금','수'].forEach(function(oh){
    var pct = r.oh.ratio[oh], bx = PAD + 70, bw = W - 2 * PAD - 70 - 70;
    y += 34;
    x.textAlign = 'left'; x.font = '500 20px ' + SERIF; x.fillText(oh + ' ' + HJ[oh], PAD, y);
    x.lineWidth = 2; x.strokeRect(bx, y - 16, bw, 14); x.fillRect(bx, y - 16, Math.round(bw * pct / 100), 14);
    x.textAlign = 'right'; x.font = '400 18px ' + SANS; x.fillText(pct + '%', W - PAD, y);
  });
  y += 22; dashed(x, y); y += 20;

  // 처방전
  x.textAlign = 'left'; x.font = '600 18px ' + SANS; y += 18; x.fillText('처방전 Rx.', PAD, y);
  function row(k, v, font){ y += 36; x.textAlign = 'left'; x.font = '400 19px ' + SANS; x.fillText(k, PAD, y); x.textAlign = 'right'; x.font = font || ('500 21px ' + SERIF); x.fillText(v, W - PAD, y); }
  row('처방 목적', r.fortuneType);
  row('처방 기운', r.prescribeOhaeng + ' (' + HJ[r.prescribeOhaeng] + ')');
  y += 16; x.lineWidth = 2; x.beginPath(); x.moveTo(PAD, y); x.lineTo(W - PAD, y); x.stroke();
  y += 50; x.textAlign = 'left'; x.font = '600 22px ' + SANS; x.fillText('오늘의 차', PAD, y);
  x.textAlign = 'right'; x.font = '600 40px ' + SERIF; x.fillText(r.tea, W - PAD, y);
  y += 24; dashed(x, y); y += 14;

  // 오늘의 메시지
  x.textAlign = 'left'; x.font = '600 18px ' + SANS; y += 22; x.fillText('오늘의 메시지', PAD, y); y += 6;
  x.font = '400 21px ' + SERIF;
  wrapLines(x, r.fortune, W - 2 * PAD).forEach(function(l){ y += 36; x.fillText(l, PAD, y); });
  y += 24; dashed(x, y); y += 16;

  // 하단
  var now = new Date(), ds = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0');
  x.textAlign = 'center'; x.font = '500 24px ' + SERIF; y += 30; spacedText(x, '다행 茶幸', CX, y, 8);
  x.font = '400 16px ' + SANS; y += 28; x.fillText(ds, CX, y);
  y += 16;

  var out = document.createElement('canvas'); out.width = W; out.height = Math.ceil(y / 8) * 8;
  var ox = out.getContext('2d'); ox.fillStyle = '#fff'; ox.fillRect(0, 0, W, out.height); ox.drawImage(c, 0, 0);
  if (illuBox) ditherRegion(ox, illuBox.x, illuBox.y, illuBox.w, illuBox.h);
  thresholdAll(ox, W, out.height, illuBox);
  return out;
}

/* ---------- ePOS로 전송 ---------- */
function eposPrintCanvas(canvas, cfg){
  return new Promise(function(resolve, reject){
    if (typeof epson === 'undefined' || !epson.ePOSDevice) { reject('ePOS SDK를 불러오지 못했어요.'); return; }
    var dev = new epson.ePOSDevice(), finished = false;
    function finish(ok, msg){ if (finished) return; finished = true; try { dev.disconnect(); } catch(e){} ok ? resolve() : reject(msg); }
    var guard = setTimeout(function(){ finish(false, eposMsg('ERROR_TIMEOUT')); }, 45000);
    dev.connect(cfg.ip, cfg.port, function(res){
      if (res !== 'OK' && res !== 'SSL_CONNECT_OK') { clearTimeout(guard); finish(false, eposMsg(res)); return; }
      dev.createDevice('local_printer', dev.DEVICE_TYPE_PRINTER, {crypto:false, buffer:false}, function(p, code){
        if (code !== 'OK') { clearTimeout(guard); finish(false, eposMsg(code)); return; }
        p.timeout = 30000;
        p.onreceive = function(rr){ clearTimeout(guard); rr.success ? finish(true) : finish(false, eposMsg(rr.code)); };
        p.onerror = function(e){ clearTimeout(guard); finish(false, eposMsg((e && e.status) || 'ERROR')); };
        p.halftone = p.HALFTONE_THRESHOLD;
        p.brightness = 1.0;
        p.addTextAlign(p.ALIGN_CENTER);
        p.addImage(canvas.getContext('2d'), 0, 0, canvas.width, canvas.height, p.COLOR_1, p.MODE_MONO);
        p.addFeedLine(3);
        p.addCut(p.CUT_FEED);
        p.send();
      });
    }, {eposprint: true});
  });
}

async function printReceipt(){
  if (!curResult || printing) return;
  printing = true;
  printOverlay('busy');
  try {
    var canvas = await buildReceiptCanvas(curResult);
    await eposPrintCanvas(canvas, printerCfg);
    printOverlay('done');
  } catch (e) {
    printOverlay('error', typeof e === 'string' ? e : '출력 중 문제가 생겼어요.');
  } finally { printing = false; }
}
